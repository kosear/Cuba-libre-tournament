<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuba Libre Pool Tournament</title>
<style>
  :root { --bg: #f3f6fb; --ink: #13213a; --muted: #6b7894; --line: #dde4ef; --blue: #2f6fcf; --red: #d21034; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  #page { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; transform-origin: 0 0; }
  body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--ink); background: var(--bg); overflow: hidden; }
  .center { position: relative; min-height: 100%; display: grid; place-items: center; padding: 4vh 4vw; text-align: center; }
  h1 { font-size: clamp(32px, 6.5vw, 120px); font-weight: 900; line-height: 1.05; }
  .choose { display: flex; flex-wrap: wrap; gap: 3vw; justify-content: center; margin-top: 6vh; }
  .opt { display: block; width: min(440px, 80vw); border-radius: 24px; padding: 34px 30px; text-align: center; background: #fff; border: 3px solid var(--line);
    box-shadow: 0 6px 24px rgba(19,33,58,.08); text-decoration: none; color: inherit; }
  .opt:focus, .opt:hover { outline: 4px solid #9db8e3; outline-offset: 3px; }
  .ic { font-size: 64px; line-height: 1; }
  .nm { font-size: 38px; font-weight: 800; margin-top: 16px; }
  .ds { font-size: 22px; color: var(--muted); margin-top: 8px; }
  .opt.tv { background: var(--blue); border-color: var(--blue); color: #fff; }
  .opt.tv .ds { color: #dce8fb; }
  .opt.admin .nm { color: var(--red); }
  @media (max-width: 800px), (orientation: portrait) {
    .center { padding: 6vh 6vw; }
    .opt { padding: 24px; }
    .nm { font-size: 28px; }
  }
</style>
</head>
<body>
<div id="page">
<div class="center">
  <div>
    <h1>Cuba Libre<br>Pool Tournament</h1>
    <div class="choose">
      <a class="opt tv" href="/board/" autofocus><div class="ic">📺</div><div class="nm">Scoreboard</div><div class="ds">Open on the TV</div></a>
      <a class="opt admin" href="/admin/"><div class="ic">🔒</div><div class="nm">Admin panel</div><div class="ds">Password required</div></a>
    </div>
  </div>
</div>
</div>
<script>
  // TV browsers may zoom the page so that only a part of it is visible: shrink it back into the visible area.
  // Without zoom (phones, computers) the factor is 1 and nothing changes.
  (function () {
    var page = document.getElementById('page');
    function fit() {
      var vv = window.visualViewport;
      if (!vv) return;
      var k = Math.min(1, vv.width / window.innerWidth, vv.height / window.innerHeight);
      page.style.transform = k < 0.99 ? 'translate(' + vv.pageLeft + 'px,' + vv.pageTop + 'px) scale(' + k + ')' : '';
    }
    fit();
    window.addEventListener('resize', fit);
    if (window.visualViewport) { visualViewport.addEventListener('resize', fit); visualViewport.addEventListener('scroll', fit); }
    setInterval(fit, 2000);
  })();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuba Libre · Splash colours</title>
<!-- Lab: the real splash (public/board/splash.js) on 30 background colours, one after another.
     On a dark colour every black part of the logo turns white. -->
<link rel="stylesheet" href="/board/style.css">
<style>
  #stage { display: block; background: #fff; }
  .splash { transition: background-color .6s; }
  #tag { position: absolute; left: 40px; top: 32px; z-index: 20; font: 800 40px/1.2 Inter, system-ui, sans-serif; letter-spacing: 1px; }
  #tag small { display: block; font-size: 24px; font-weight: 600; opacity: .75; }
</style>
</head>
<body>
<div id="stage"><div class="splash" id="splash"></div><div id="tag"></div></div>
<script type="module">
import { live } from '/shared/live.js';
import { startSplash } from '/board/splash.js';
live({ onState() {} }); // reload after a deploy

const COLORS = [
  ['White', '#ffffff'], ['Ivory', '#fbf6ea'], ['Cream', '#f3e7c9'], ['Sand', '#e6d3a8'], ['Pale mint', '#dff3e8'],
  ['Sky', '#d9ecfb'], ['Lavender', '#e7e0f6'], ['Blush', '#f8dfe2'], ['Peach', '#fbd9bf'], ['Lemon', '#fbf0a6'],
  ['Honda Monkey orange', '#f47b20'], ['Coral', '#ff6f5e'], ['Cuba red', '#c8102e'], ['Brick', '#9c3b2b'], ['Burgundy', '#5e1224'],
  ['Pool felt green', '#0f6b3a'], ['Emerald', '#1a8f5a'], ['Lime', '#b5d33d'], ['Olive', '#5f6b2a'], ['Deep teal', '#0e4d4a'],
  ['Turquoise', '#1fb5ac'], ['Cuba blue', '#1d4fbf'], ['Navy', '#0f2147'], ['Royal purple', '#4b2a86'], ['Plum', '#6d2d5c'],
  ['Hot pink', '#e83e8c'], ['Mustard', '#d9a81e'], ['Tobacco', '#6b4a2b'], ['Graphite', '#2b2f36'], ['Night', '#0b0d14'],
];

// Fit the 1920×1080 stage into what is visible, like the board.
const stage = document.getElementById('stage');
function fit() {
  const vv = window.visualViewport;
  const a = vv && vv.width > 0 ? { w: vv.width, h: vv.height, x: vv.pageLeft, y: vv.pageTop } : { w: innerWidth, h: innerHeight, x: 0, y: 0 };
  const k = Math.min(a.w / 1920, a.h / 1080);
  stage.style.transform = `translate(${a.x + (a.w - 1920 * k) / 2}px, ${a.y + (a.h - 1080 * k) / 2}px) scale(${k})`;
}
addEventListener('resize', fit);
setInterval(fit, 2000);
fit();

// Relative luminance (WCAG): below ~0.35 the background counts as dark.
function isDark(hex) {
  const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2] < 0.35;
}

const box = document.getElementById('splash');
startSplash(box);

// Two versions of the logo: as drawn, and with every near-black fill turned white (for dark backgrounds).
const svg = await (await fetch('/assets/cuba-libre-logo.svg')).text();
const lightSvg = svg.replace(/fill="#(1[0-9A-Fa-f]{5})"/g, (m, hex) => (parseInt(hex.slice(0, 2), 16) < 0x30 ? 'fill="#FFFFFF"' : m));
const lightUrl = URL.createObjectURL(new Blob([lightSvg], { type: 'image/svg+xml' }));
const normalUrl = '/assets/cuba-libre-logo.svg';

let i = 0;
function show() {
  const [name, hex] = COLORS[i];
  const dark = isDark(hex);
  box.style.backgroundColor = hex;
  const logo = box.querySelector('.splash-logo');
  const want = dark ? lightUrl : normalUrl;
  if (logo && logo.getAttribute('src') !== want) logo.src = want;
  const tag = document.getElementById('tag');
  tag.style.color = dark ? '#fff' : '#111';
  tag.innerHTML = `${i + 1} / ${COLORS.length} · ${name}<small>${hex}${dark ? ' · dark: black parts → white' : ''}</small>`;
  i = (i + 1) % COLORS.length;
}
show();
setInterval(show, 6000);
</script>
</body>
</html>

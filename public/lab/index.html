<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuba Libre · Lab</title>
<!-- Animation playground, not part of the app: fake data. Now: the «Now playing» call screen.
     The slide transition tried here earlier is in git history and on the board (public/board/app.js). -->
<style>
  :root { --ink: #13213a; --muted: #6b7894; --blue: #2f6fcf; --red: #d21034; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
  body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--ink); }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: #fff; overflow: hidden; }
  .sub { position: absolute; left: 0; right: 0; top: 170px; text-align: center; font-size: 110px; line-height: 1; font-weight: 900; color: var(--blue); letter-spacing: 8px; text-transform: uppercase; }
  .label { position: absolute; left: 0; right: 0; top: 300px; text-align: center; font-size: 40px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 3px; }
  /* each name sits centred in its half; it is moved in with a transform from the other side of the screen */
  .name { position: absolute; width: 840px; height: 154px; text-align: center; font-size: 140px; line-height: 1.1; font-weight: 800; text-transform: uppercase; white-space: nowrap; will-change: transform; }
  /* different heights: the names never overlap, even when they cross in the middle (154 px lines, 46 px apart) */
  .n1 { left: 60px; top: 440px; }
  .n2 { right: 60px; top: 640px; }
  .vs { position: absolute; left: 0; right: 0; top: 563px; text-align: center; font-size: 90px; font-weight: 900; color: var(--red); will-change: transform; }
</style>
</head>
<body>
<div id="stage">
  <div class="sub">Now playing</div>
  <div class="label" id="label"></div>
  <div class="name n1" id="n1"></div>
  <div class="vs" id="vs">VS</div>
  <div class="name n2" id="n2"></div>
</div>
<script>
const PAIRS = [
  ['Andrei', 'Bobr', 'Group A'],
  ['Maxim Petrov', 'Igor', 'Group B'],
  ['Alexander the Great', 'Lena', 'Group C'],
  ['Timur', 'Sergey', 'Semi-final 1'],
];
const ENTER_MS = 1300; // names fly in
const HOLD_MS = 4500; // then the screen stays
const $ = (id) => document.getElementById(id);

// Same as the board: fit the 1920×1080 stage into what is really visible (TV browsers zoom pages).
const stage = $('stage');
function fit() {
  const vv = window.visualViewport;
  const a = vv && vv.width > 0 ? { w: vv.width, h: vv.height, x: vv.pageLeft, y: vv.pageTop } : { w: innerWidth, h: innerHeight, x: 0, y: 0 };
  const k = Math.min(a.w / 1920, a.h / 1080);
  stage.style.transform = `translate(${a.x + (a.w - 1920 * k) / 2}px, ${a.y + (a.h - 1080 * k) / 2}px) scale(${k})`;
}
addEventListener('resize', fit);
window.visualViewport?.addEventListener('resize', fit);
setInterval(fit, 2000);
fit();

function setName(el, text) {
  el.textContent = text;
  el.style.fontSize = '';
  let size = 140;
  while (size > 50 && el.scrollWidth > el.clientWidth + 1) el.style.fontSize = `${(size -= 4)}px`;
}

let i = 0;
function play() {
  const [a, b, label] = PAIRS[i++ % PAIRS.length];
  $('label').textContent = label;
  setName($('n1'), a);
  setName($('n2'), b);
  // Player 1 comes from beyond the right edge and lands in the left half, player 2 the other way round.
  // They cross in the middle; a small overshoot at the end, then settle.
  const fly = (from, over) => [
    { transform: `translateX(${from}px)`, easing: 'cubic-bezier(.2,.7,.3,1)' },
    { transform: `translateX(${over}px)`, offset: 0.82, easing: 'ease-in-out' },
    { transform: 'translateX(0)' },
  ];
  $('n1').animate(fly(1920, -40), { duration: ENTER_MS, fill: 'backwards' });
  $('n2').animate(fly(-1920, 40), { duration: ENTER_MS, fill: 'backwards' });
  // VS pops in once the names have landed.
  $('vs').animate([
    { transform: 'scale(0)', opacity: 0 },
    { transform: 'scale(1.35)', opacity: 1, offset: 0.6 },
    { transform: 'scale(1)', opacity: 1 },
  ], { duration: 450, delay: ENTER_MS - 150, easing: 'ease-out', fill: 'backwards' });
  setTimeout(play, ENTER_MS + HOLD_MS);
}
play();
</script>
</body>
</html>

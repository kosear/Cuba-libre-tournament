<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuba Libre · Lab</title>
<!-- Animation playground, not part of the app: fake data. Now: the «Now playing» call screen, fight-night style.
     The slide transition tried here earlier is in git history and on the board (public/board/app.js). -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #0b0d14; }
  #ring { position: absolute; inset: -60px; will-change: transform; } /* shaken on impacts; bigger than the stage so the edges never show */
  /* red corner left, blue corner right, split on a diagonal */
  .corner { position: absolute; inset: 0; }
  .red { background: linear-gradient(115deg, #7a0016 0%, #c8102e 48.5%, transparent 48.6%); }
  .blue { background: linear-gradient(115deg, transparent 51.4%, #1d4fbf 51.5%, #0a1f5c 100%); }
  .gap { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 48.5%, #0b0d14 48.6%, #0b0d14 51.4%, transparent 51.5%); }
  /* divider variant: a black lightning bolt along the seam instead of the straight band */
  .bolt { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  #ring.bolted .bolt { display: block; }
  #ring.bolted .gap { display: none; }
  /* the red corner is cut along the left edge of the bolt, the blue one fills everything behind */
  #ring.bolted .red { background: linear-gradient(115deg, #7a0016 0%, #c8102e 60%);
    clip-path: polygon(0 0, 63.24% 0, 54.41% 33.33%, 59.56% 34.17%, 48.53% 65.83%, 53.68% 66.67%, 38.73% 100%, 0 100%); }
  #ring.bolted .blue { background: linear-gradient(115deg, #1d4fbf 40%, #0a1f5c 100%); }
  /* background patterns over the corners, pure CSS; the scene cycles through them (PATTERNS in the script) */
  .pattern { position: absolute; inset: 0; pointer-events: none; }
  .p-halftone { opacity: .35; background: radial-gradient(circle, #000 0 38%, transparent 40%) 0 0 / 22px 22px;
    -webkit-mask: radial-gradient(ellipse at center, transparent 25%, #000 85%); mask: radial-gradient(ellipse at center, transparent 25%, #000 85%); }
  .p-carbon { opacity: .28; background:
    linear-gradient(27deg, #000 5px, transparent 5px) 0 5px / 20px 20px, linear-gradient(207deg, #000 5px, transparent 5px) 10px 0 / 20px 20px,
    linear-gradient(27deg, #222 5px, transparent 5px) 0 10px / 20px 20px, linear-gradient(207deg, #222 5px, transparent 5px) 10px 5px / 20px 20px,
    linear-gradient(90deg, #1b1b1b 10px, transparent 10px) 0 0 / 20px 20px,
    linear-gradient(#1d1d1d 25%, #1a1a1a 25%, #1a1a1a 50%, transparent 50%, transparent 75%, #242424 75%, #242424) 0 0 / 20px 20px; }
  .p-chevron { opacity: .16; background:
    linear-gradient(135deg, #fff 25%, transparent 25%) -60px 0 / 120px 120px, linear-gradient(225deg, #fff 25%, transparent 25%) -60px 0 / 120px 120px,
    linear-gradient(315deg, #fff 25%, transparent 25%) 0 0 / 120px 120px, linear-gradient(45deg, #fff 25%, transparent 25%) 0 0 / 120px 120px; }
  .p-ropes { background:
    linear-gradient(transparent 0 calc(30% - 9px), rgba(255,255,255,.22) calc(30% - 9px) calc(30% + 9px), transparent 0),
    linear-gradient(transparent 0 calc(52% - 9px), rgba(255,255,255,.22) calc(52% - 9px) calc(52% + 9px), transparent 0),
    linear-gradient(transparent 0 calc(74% - 9px), rgba(255,255,255,.22) calc(74% - 9px) calc(74% + 9px), transparent 0); }
  .p-checker { opacity: .08; background: repeating-conic-gradient(#fff 0 25%, transparent 0 50%) 0 0 / 90px 90px; transform: rotate(-25deg) scale(1.6); }
  .p-felt { opacity: .22; background:
    repeating-linear-gradient(45deg, rgba(0,0,0,.6) 0 1px, transparent 1px 4px), repeating-linear-gradient(-45deg, rgba(255,255,255,.25) 0 1px, transparent 1px 5px); }
  .pname { position: absolute; left: 24px; bottom: 18px; z-index: 5; font-size: 22px; color: rgba(255,255,255,.6); letter-spacing: 2px; text-transform: uppercase; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .sub { position: absolute; left: 0; right: 0; top: 130px; text-align: center; font-size: 104px; line-height: 1; font-weight: 900;
    letter-spacing: 6px; text-transform: uppercase; text-shadow: 0 6px 0 rgba(0,0,0,.45); }
  .label { position: absolute; left: 0; right: 0; top: 262px; text-align: center; font-size: 38px; font-weight: 800; font-style: italic; color: #ffd400;
    text-transform: uppercase; letter-spacing: 6px; }
  /* names: different heights, they cross without touching */
  /* a name box: up to 2 lines, wrapped at spaces only; one long word shrinks instead of breaking (setName) */
  .name { position: absolute; z-index: 2; width: 670px; height: 220px; display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 150px; line-height: 1; font-weight: 900; font-style: italic; text-transform: uppercase; will-change: transform;
    text-shadow: 0 8px 0 rgba(0,0,0,.5), 0 0 40px rgba(0,0,0,.35); }
  .name span { display: block; max-width: 100%; }
  /* different heights: 380-600 and 640-860, they cross without touching.
     #ring is 60 px wider than the stage on each side: 180 px here = 120 px from the screen edge. */
  .n1 { left: 180px; top: 380px; }
  .n2 { right: 180px; top: 640px; }
  /* VS: on top of the patterns, between the two names (670 px each, 340 px free in the middle) */
  .vs { position: absolute; z-index: 3; left: 0; right: 0; top: 510px; text-align: center; font-size: 220px; line-height: 220px; font-weight: 900; font-style: italic;
    color: #ffd400; text-shadow: 0 0 50px rgba(0,0,0,.45); will-change: transform; }
  /* fire round: flames along the bottom, embers, a dragon behind each name */
  #fire { display: none; }
  #ring.fire #fire { display: block; }
  #ring.fire.real #fire { display: none; }
  /* realistic fire: a small canvas simulated pixel by pixel, stretched and smoothed */
  #realfire { position: absolute; left: 0; bottom: 60px; width: 2040px; height: 460px; z-index: 1; display: none; pointer-events: none; }
  #ring.fire.real #realfire { display: block; }
  #fire { position: absolute; left: 0; right: 0; bottom: 60px; height: 360px; z-index: 1; pointer-events: none; } /* 60 px: #ring overhangs the stage */
  .flame { position: absolute; bottom: -20px; transform-origin: 50% 100%; animation: flicker var(--d) ease-in-out infinite alternate; }
  @keyframes flicker {
    0% { transform: scaleY(1) scaleX(1) skewX(0); }
    35% { transform: scaleY(1.18) scaleX(.92) skewX(-4deg); }
    70% { transform: scaleY(.9) scaleX(1.06) skewX(3deg); }
    100% { transform: scaleY(1.1) scaleX(.96) skewX(-2deg); }
  }
  .ember { position: absolute; bottom: 40px; width: 8px; height: 8px; border-radius: 50%; background: #ffd27a; box-shadow: 0 0 10px #ff8a00;
    animation: rise var(--d) linear infinite; animation-delay: var(--delay); opacity: 0; }
  @keyframes rise {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translate(var(--dx), -700px); opacity: 0; }
  }
  /* mascots: an emoji animal or thing with a hat and something in hand, one per player, behind the names */
  .mascot { position: absolute; z-index: 1; font-size: 300px; line-height: 1; will-change: transform; filter: drop-shadow(0 10px 0 rgba(0,0,0,.4)); }
  .mascot .hat { position: absolute; left: 50%; top: -.36em; font-size: .52em; transform: translateX(-50%) rotate(-10deg); }
  .mascot .item { position: absolute; right: -.18em; bottom: -.02em; font-size: .46em; transform: rotate(14deg); }
  .mascot.m2 .item { right: auto; left: -.18em; transform: rotate(-14deg); }
  .mascot.m1 { left: 70px; top: 170px; }
  .mascot.m2 { right: 70px; top: 700px; }
  .mname { position: absolute; z-index: 1; font-size: 26px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,.75); }
  .mname.m1 { left: 80px; top: 120px; }
  .mname.m2 { right: 80px; bottom: 120px; }
</style>
</head>
<body>
<div id="stage">
  <div id="ring">
    <div class="corner red"></div><div class="corner blue"></div><div class="gap"></div><div class="pattern" id="pattern"></div>
    <svg class="bolt" viewBox="0 0 2040 1200" preserveAspectRatio="none" aria-hidden="true">
      <polygon fill="#0b0d14" points="1290,0 1110,400 1215,410 990,790 1095,800 790,1200 850,1200 1150,830 1045,820 1270,440 1165,430 1350,0"/>
    </svg>
    <div id="fire"></div>
    <canvas id="realfire" width="170" height="64"></canvas>
    <div class="mascot m1" id="d1"></div><div class="mascot m2" id="d2"></div>
    <div class="mname m1" id="mn1"></div><div class="mname m2" id="mn2"></div>
    <div class="sub">Now playing</div>
    <div class="label" id="label"></div>
    <div class="name n1" id="n1"></div>
    <div class="vs" id="vs">VS</div>
    <div class="name n2" id="n2"></div>
  </div>
  <div class="flash" id="flash"></div>
  <div class="pname" id="pname"></div>
</div>
<script type="module">
// Reload by itself after a deploy, like the board.
import { live } from '/shared/live.js';
live({ onState() {} });

const PAIRS = [
  ['Andrei', 'Bobr', 'Group A'],
  ['Maxim Petrov', 'Igor', 'Group B'],
  ['Alexander the Great', 'Lena', 'Group C'],
  ['Timur', 'Sergey', 'Semi-final 1'],
  ['Konstantin Konstantinopolsky', 'Alexander the Great', 'Group D'],
  ['Константин Константинопольский', 'Ян', 'Group A'],
  ['Константинопольский', 'Alexander the Great', 'Final'],
];
const HOLD_MS = 4500;
const PATTERNS = ['halftone', 'carbon', 'chevron', 'ropes', 'checker', 'felt']; // a new one on every round
const $ = (id) => document.getElementById(id);

// Flames: SVG tongues with a yellow-orange-red gradient, each flickering at its own pace; embers rising.
(function buildFire() {
  const tongue = (w, h, id) => `<svg width="${w}" height="${h}" viewBox="0 0 100 160"><defs><linearGradient id="${id}" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#fff3a0"/><stop offset=".25" stop-color="#ffc400"/><stop offset=".6" stop-color="#ff5a00"/><stop offset="1" stop-color="#c8102e" stop-opacity="0"/></linearGradient></defs>
    <path d="M50 0 C62 30 92 52 92 100 C92 136 74 160 50 160 C26 160 8 136 8 100 C8 70 30 58 34 30 C40 48 46 52 50 0z" fill="url(#${id})"/></svg>`;
  let html = '';
  for (let k = 0; k < 18; k++) {
    const w = 170 + Math.random() * 90;
    const h = 200 + Math.random() * 160;
    html += `<div class="flame" style="left:${k * 118 - 40}px;--d:${(0.35 + Math.random() * 0.4).toFixed(2)}s">${tongue(w, h, `fg${k}`)}</div>`;
  }
  for (let k = 0; k < 26; k++) {
    html += `<div class="ember" style="left:${Math.random() * 2040}px;--d:${(1.6 + Math.random() * 1.8).toFixed(2)}s;--delay:${(-Math.random() * 3).toFixed(2)}s;--dx:${Math.round(Math.random() * 160 - 80)}px"></div>`;
  }
  document.getElementById('fire').innerHTML = html;
})();

// ---------- realistic fire: classic «Doom fire» on a tiny canvas, stretched and smoothed ----------
const realFire = (() => {
  const cv = $('realfire');
  const ctx = cv.getContext('2d');
  const FW = cv.width;
  const FH = cv.height;
  const heat = new Uint8Array(FW * FH);
  const MAX = 36;
  // black -> dark red -> orange -> yellow -> white; low heat is transparent so the corners show through
  const pal = [];
  for (let k = 0; k <= MAX; k++) {
    const t = k / MAX;
    const r = Math.min(255, Math.round(255 * Math.min(1, t * 2.2)));
    const g = Math.round(255 * Math.max(0, Math.min(1, (t - 0.35) * 1.8)));
    const b = Math.round(255 * Math.max(0, (t - 0.8) * 4));
    pal.push([r, g, b, Math.round(255 * Math.min(1, t * 3.5))]);
  }
  const img = ctx.createImageData(FW, FH);
  let running = false;
  let last = 0;
  for (let x = 0; x < FW; x++) heat[(FH - 1) * FW + x] = MAX; // the source: hottest bottom row
  function step() {
    for (let x = 0; x < FW; x++) {
      for (let y = 1; y < FH; y++) {
        const src = y * FW + x;
        const r = (Math.random() * 3.6) | 0; // decay and sideways drift: flames lick and flicker
        const dst = src - FW - (r & 1) + ((Math.random() * 1.6) | 0);
        if (dst >= 0) heat[dst] = Math.max(0, heat[src] - (r > 2 ? 2 : r & 1));
      }
    }
    for (let k = 0; k < heat.length; k++) {
      const c = pal[heat[k]];
      img.data[k * 4] = c[0]; img.data[k * 4 + 1] = c[1]; img.data[k * 4 + 2] = c[2]; img.data[k * 4 + 3] = c[3];
    }
    ctx.putImageData(img, 0, 0);
  }
  function frame(now) {
    if (!running) return;
    if (now - last > 33) { step(); last = now; } // ~30 fps is plenty
    requestAnimationFrame(frame);
  }
  return {
    start() { if (!running) { running = true; requestAnimationFrame(frame); } },
    stop() { running = false; },
  };
})();

// ---------- mascots: [body, hat, item, name] ----------
const MASCOTS = [
  ['🐶', '🎩', '🥊', 'Gentleman Pug'], ['🐱', '👑', '🥊', 'King Cat'], ['🐸', '🕶️', '', 'Cool Frog'],
  ['🐷', '🎓', '📚', 'Professor Pig'], ['🐔', '🪖', '🥊', 'Army Chicken'], ['🦆', '🧢', '', 'Duck in a Cap'],
  ['🐻', '🤠', '🌵', 'Cowboy Bear'], ['🦜', '🏴‍☠️', '⚔️', 'Pirate Parrot'], ['🐵', '', '🍌', 'Banana Monkey'],
  ['🐼', '🎀', '🎋', 'Panda with a Bow'], ['🦖', '', '🥊', 'Tiny-arms T-Rex'], ['🐙', '🎩', '🎱', 'Octopus Hustler'],
  ['🦈', '🕶️', '🎱', 'Pool Shark'], ['🐢', '⛑️', '', 'Safety Turtle'], ['🦄', '', '🎸', 'Rock Unicorn'],
  ['🐧', '🎩', '🌹', 'Penguin in a Tux'], ['🐮', '🤠', '🥛', 'Cowboy Cow'], ['🦊', '🕶️', '💰', 'Sly Fox'],
  ['🐭', '', '🧀', 'Mouse with Cheese'], ['🐉', '', '🔥', 'Dragon'], ['🥔', '🕶️', '🍟', 'Cool Potato'],
];
function setMascot(n, m) {
  const [body, hat, item, title] = m;
  $(`d${n}`).innerHTML = `${body}${hat ? `<span class="hat">${hat}</span>` : ''}${item ? `<span class="item">${item}</span>` : ''}`;
  $(`mn${n}`).textContent = title;
}

// ---------- idle motion after the names have landed: one variant per round ----------
const IDLES = ['drift', 'sway', 'heartbeat', 'stare-down', 'adrenaline'];
let idleAnims = [];
const loop = (el, frames, ms, delay, extra = {}) => idleAnims.push(el.animate(frames, { duration: ms, delay, iterations: Infinity, easing: 'ease-in-out', ...extra }));
const jitter = (px) => [
  { transform: 'translate(0,0)' }, { transform: `translate(${px}px,${-px}px)` }, { transform: `translate(${-px}px,${px * 0.5}px)` },
  { transform: `translate(${px * 0.5}px,${px}px)` }, { transform: 'translate(0,0)' },
];
function startIdle(kind, at, hold) {
  const s1 = $('n1').firstChild;
  const s2 = $('n2').firstChild;
  const vs = $('vs');
  const sub = document.querySelector('.sub');
  if (kind === 'drift') {
    loop(s1, [{ transform: 'translateX(0)' }, { transform: 'translateX(28px)' }, { transform: 'translateX(0)' }], 2400, at);
    loop(s2, [{ transform: 'translateX(0)' }, { transform: 'translateX(-28px)' }, { transform: 'translateX(0)' }], 2400, at);
    loop(vs, [{ transform: 'scale(1)' }, { transform: 'scale(1.07)' }, { transform: 'scale(1)' }], 1600, at);
  } else if (kind === 'sway') {
    loop(s1, [{ transform: 'translateY(0)' }, { transform: 'translateY(-14px)' }, { transform: 'translateY(0)' }, { transform: 'translateY(14px)' }, { transform: 'translateY(0)' }], 2600, at);
    loop(s2, [{ transform: 'translateY(0)' }, { transform: 'translateY(14px)' }, { transform: 'translateY(0)' }, { transform: 'translateY(-14px)' }, { transform: 'translateY(0)' }], 2600, at);
    loop(vs, [{ transform: 'rotate(0)' }, { transform: 'rotate(-4deg)' }, { transform: 'rotate(0)' }, { transform: 'rotate(4deg)' }, { transform: 'rotate(0)' }], 2200, at);
  } else if (kind === 'heartbeat') {
    loop(vs, [{ transform: 'scale(1)' }, { transform: 'scale(1.16)', offset: 0.1 }, { transform: 'scale(1)', offset: 0.22 },
      { transform: 'scale(1.1)', offset: 0.32 }, { transform: 'scale(1)', offset: 0.46 }, { transform: 'scale(1)' }], 1000, at, { easing: 'ease-out' });
    loop(sub, jitter(1.5), 160, at, { easing: 'linear' });
  } else if (kind === 'stare-down') {
    idleAnims.push(s1.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(70px)' }], { duration: hold, delay: at, easing: 'ease-in', fill: 'forwards' }));
    idleAnims.push(s2.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-70px)' }], { duration: hold, delay: at, easing: 'ease-in', fill: 'forwards' }));
    loop(vs, jitter(2.5), 140, at, { easing: 'linear' });
  } else if (kind === 'adrenaline') {
    loop(s1, jitter(3), 120, at, { easing: 'linear' });
    loop(s2, jitter(3), 130, at, { easing: 'linear' });
    loop(vs, jitter(4), 110, at, { easing: 'linear' });
    loop(sub, jitter(2), 150, at, { easing: 'linear' });
  }
}

// Same as the board: fit the 1920×1080 stage into what is really visible (TV browsers zoom pages).
const stage = $('stage');
function fit() {
  const vv = window.visualViewport;
  const a = vv && vv.width > 0 ? { w: vv.width, h: vv.height, x: vv.pageLeft, y: vv.pageTop } : { w: innerWidth, h: innerHeight, x: 0, y: 0 };
  const k = Math.min(a.w / 1920, a.h / 1080);
  stage.style.transform = `translate(${a.x + (a.w - 1920 * k) / 2}px, ${a.y + (a.h - 1080 * k) / 2}px) scale(${k})`;
}
addEventListener('resize', fit);
window.visualViewport?.addEventListener('resize', fit);
setInterval(fit, 2000);
fit();

function setName(el, text) {
  el.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = text;
  el.append(span);
  // Shrink until it fits: at most 2 lines in the box, and no single word wider than the box.
  let size = 150;
  el.style.fontSize = `${size}px`;
  const lines = () => Math.round(span.offsetHeight / size);
  while (size > 40 && (span.scrollWidth > el.clientWidth + 1 || lines() > 2 || span.offsetHeight > el.clientHeight)) {
    el.style.fontSize = `${(size -= 4)}px`;
  }
}

// Impact: the whole ring jolts, a white flash.
function impact(at, power) {
  $('ring').animate([
    { transform: 'none' },
    { transform: `translate(${-power}px, ${power * 0.6}px) rotate(-.4deg)`, offset: 0.15 },
    { transform: `translate(${power * 0.7}px, ${-power * 0.5}px) rotate(.3deg)`, offset: 0.35 },
    { transform: `translate(${-power * 0.35}px, ${power * 0.25}px)`, offset: 0.6 },
    { transform: 'none' },
  ], { duration: 380, delay: at, easing: 'ease-out' });
  $('flash').animate([{ opacity: power / 60 }, { opacity: 0 }], { duration: 260, delay: at, easing: 'ease-out' });
}

let i = 0;
function play() {
  const [a, b, label] = PAIRS[i++ % PAIRS.length];
  $('label').textContent = label;
  setName($('n1'), a);
  setName($('n2'), b);
  const pat = PATTERNS[(i - 1) % PATTERNS.length];
  $('pattern').className = `pattern p-${pat}`;
  const bolt = (i - 1) % 2 === 1; // every other round: the lightning divider
  $('ring').classList.toggle('bolted', bolt);
  const fire = (i - 1) % 3 === 2; // every third round: flames and dragons
  const real = fire && ((i - 1) / 3 | 0) % 2 === 0; // fire rounds alternate: realistic, cartoon
  $('ring').classList.toggle('fire', fire);
  $('ring').classList.toggle('real', real);
  if (real) realFire.start(); else realFire.stop();
  const idle = IDLES[(i - 1) % IDLES.length];
  idleAnims.forEach((x) => x.cancel());
  idleAnims = [];
  $('pname').textContent = `pattern: ${pat} · divider: ${bolt ? 'lightning' : 'band'} · idle: ${idle}${fire ? ` · fire: ${real ? 'real' : 'cartoon'}` : ''}`; // mascot names are on screen
  // Two different random mascots swoop in from the edges right behind the names, then bob a little.
  const m1 = MASCOTS[Math.floor(Math.random() * MASCOTS.length)];
  let m2;
  do m2 = MASCOTS[Math.floor(Math.random() * MASCOTS.length)]; while (m2 === m1);
  setMascot(1, m1);
  setMascot(2, m2);
  for (const [n, from, delay] of [[1, -700, 60], [2, 700, 360]]) {
    $(`d${n}`).animate([{ transform: `translateX(${from}px) rotate(${from > 0 ? 14 : -14}deg)` }, { transform: 'translateX(0) rotate(0)' }],
      { duration: 500, delay, easing: 'cubic-bezier(.2,.8,.3,1.4)', fill: 'backwards' });
    $(`mn${n}`).animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: delay + 400, fill: 'backwards' });
    idleAnims.push($(`d${n}`).animate([{ transform: 'translateY(0) rotate(0)' }, { transform: `translateY(-16px) rotate(${n === 1 ? 4 : -4}deg)` }, { transform: 'translateY(0) rotate(0)' }],
      { duration: 900 + n * 120, delay: delay + 500, iterations: Infinity, easing: 'ease-in-out' }));
  }
  const T1 = 120; // player 1 punches in
  const T2 = 420; // player 2 answers
  const TV = 820; // VS slams down
  const FLY = 330; // very fast flight
  // From beyond the opposite edge, leaning into the move, slight stretch; lands with a hard stop and recoil.
  const punch = (from, dir) => [
    { transform: `translateX(${from}px) skewX(${-dir * 22}deg) scaleX(1.25)`, easing: 'cubic-bezier(.5,0,.9,.4)' },
    { transform: `translateX(${-dir * 50}px) skewX(${dir * 10}deg) scaleX(.92)`, offset: 0.78, easing: 'ease-out' },
    { transform: 'translateX(0) skewX(0) scaleX(1)' },
  ];
  $('n1').animate(punch(1920, 1), { duration: FLY, delay: T1, fill: 'backwards' });
  $('n2').animate(punch(-1920, -1), { duration: FLY, delay: T2, fill: 'backwards' });
  impact(T1 + FLY * 0.78, 22);
  impact(T2 + FLY * 0.78, 22);
  $('vs').animate([
    { transform: 'scale(6) rotate(-12deg)', opacity: 0, easing: 'cubic-bezier(.6,0,.9,.5)' },
    { transform: 'scale(.85) rotate(4deg)', opacity: 1, offset: 0.7 },
    { transform: 'scale(1) rotate(0)', opacity: 1 },
  ], { duration: 340, delay: TV, fill: 'backwards' });
  impact(TV + 240, 36);
  startIdle(idle, TV + 600, HOLD_MS);
  // Header and label hit first.
  $('label').animate([{ opacity: 0, transform: 'translateY(-30px)' }, { opacity: 1, transform: 'none' }], { duration: 250, fill: 'backwards' });
  setTimeout(play, TV + 600 + HOLD_MS);
}
play();
</script>

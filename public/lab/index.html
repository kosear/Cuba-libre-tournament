<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuba Libre · Lab</title>
<!-- Animation playground, not part of the app: fake data. Now: the «Now playing» call screen, fight-night style.
     The slide transition tried here earlier is in git history and on the board (public/board/app.js). -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #0b0d14; }
  #ring { position: absolute; inset: -60px; will-change: transform; } /* shaken on impacts; bigger than the stage so the edges never show */
  /* red corner left, blue corner right, split on a diagonal */
  .corner { position: absolute; inset: 0; }
  .red { background: linear-gradient(115deg, #7a0016 0%, #c8102e 48.5%, transparent 48.6%); }
  .blue { background: linear-gradient(115deg, transparent 51.4%, #1d4fbf 51.5%, #0a1f5c 100%); }
  .gap { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 48.5%, #0b0d14 48.6%, #0b0d14 51.4%, transparent 51.5%); }
  /* divider variant: a black lightning bolt along the seam instead of the straight band */
  .bolt { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  #ring.bolted .bolt { display: block; }
  #ring.bolted .gap { display: none; }
  #ring.bolted .red { background: linear-gradient(115deg, #7a0016 0%, #c8102e 50%, transparent 50.1%); }
  #ring.bolted .blue { background: linear-gradient(115deg, transparent 49.9%, #1d4fbf 50%, #0a1f5c 100%); }
  /* background patterns over the corners, pure CSS; the scene cycles through them (PATTERNS in the script) */
  .pattern { position: absolute; inset: 0; pointer-events: none; }
  .p-halftone { opacity: .35; background: radial-gradient(circle, #000 0 38%, transparent 40%) 0 0 / 22px 22px;
    -webkit-mask: radial-gradient(ellipse at center, transparent 25%, #000 85%); mask: radial-gradient(ellipse at center, transparent 25%, #000 85%); }
  .p-carbon { opacity: .28; background:
    linear-gradient(27deg, #000 5px, transparent 5px) 0 5px / 20px 20px, linear-gradient(207deg, #000 5px, transparent 5px) 10px 0 / 20px 20px,
    linear-gradient(27deg, #222 5px, transparent 5px) 0 10px / 20px 20px, linear-gradient(207deg, #222 5px, transparent 5px) 10px 5px / 20px 20px,
    linear-gradient(90deg, #1b1b1b 10px, transparent 10px) 0 0 / 20px 20px,
    linear-gradient(#1d1d1d 25%, #1a1a1a 25%, #1a1a1a 50%, transparent 50%, transparent 75%, #242424 75%, #242424) 0 0 / 20px 20px; }
  .p-chevron { opacity: .16; background:
    linear-gradient(135deg, #fff 25%, transparent 25%) -60px 0 / 120px 120px, linear-gradient(225deg, #fff 25%, transparent 25%) -60px 0 / 120px 120px,
    linear-gradient(315deg, #fff 25%, transparent 25%) 0 0 / 120px 120px, linear-gradient(45deg, #fff 25%, transparent 25%) 0 0 / 120px 120px; }
  .p-ropes { background:
    linear-gradient(transparent 0 calc(30% - 9px), rgba(255,255,255,.22) calc(30% - 9px) calc(30% + 9px), transparent 0),
    linear-gradient(transparent 0 calc(52% - 9px), rgba(255,255,255,.22) calc(52% - 9px) calc(52% + 9px), transparent 0),
    linear-gradient(transparent 0 calc(74% - 9px), rgba(255,255,255,.22) calc(74% - 9px) calc(74% + 9px), transparent 0); }
  .p-checker { opacity: .08; background: repeating-conic-gradient(#fff 0 25%, transparent 0 50%) 0 0 / 90px 90px; transform: rotate(-25deg) scale(1.6); }
  .p-felt { opacity: .22; background:
    repeating-linear-gradient(45deg, rgba(0,0,0,.6) 0 1px, transparent 1px 4px), repeating-linear-gradient(-45deg, rgba(255,255,255,.25) 0 1px, transparent 1px 5px); }
  .pname { position: absolute; left: 24px; bottom: 18px; z-index: 5; font-size: 22px; color: rgba(255,255,255,.6); letter-spacing: 2px; text-transform: uppercase; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .sub { position: absolute; left: 0; right: 0; top: 130px; text-align: center; font-size: 104px; line-height: 1; font-weight: 900;
    letter-spacing: 6px; text-transform: uppercase; text-shadow: 0 6px 0 rgba(0,0,0,.45); }
  .label { position: absolute; left: 0; right: 0; top: 262px; text-align: center; font-size: 38px; font-weight: 800; font-style: italic; color: #ffd400;
    text-transform: uppercase; letter-spacing: 6px; }
  /* names: different heights, they cross without touching */
  /* a name box: up to 2 lines, wrapped at spaces only; one long word shrinks instead of breaking (setName) */
  .name { position: absolute; z-index: 2; width: 670px; height: 220px; display: flex; align-items: center; justify-content: center; text-align: center;
    font-size: 150px; line-height: 1; font-weight: 900; font-style: italic; text-transform: uppercase; will-change: transform;
    text-shadow: 0 8px 0 rgba(0,0,0,.5), 0 0 40px rgba(0,0,0,.35); }
  .name span { display: block; max-width: 100%; }
  /* different heights: 380-600 and 640-860, they cross without touching.
     #ring is 60 px wider than the stage on each side: 180 px here = 120 px from the screen edge. */
  .n1 { left: 180px; top: 380px; }
  .n2 { right: 180px; top: 640px; }
  /* VS: on top of the patterns, between the two names (670 px each, 340 px free in the middle) */
  .vs { position: absolute; z-index: 3; left: 0; right: 0; top: 510px; text-align: center; font-size: 220px; line-height: 220px; font-weight: 900; font-style: italic;
    color: #ffd400; text-shadow: 0 0 50px rgba(0,0,0,.45); will-change: transform; }
</style>
</head>
<body>
<div id="stage">
  <div id="ring">
    <div class="corner red"></div><div class="corner blue"></div><div class="gap"></div><div class="pattern" id="pattern"></div>
    <svg class="bolt" viewBox="0 0 2040 1200" preserveAspectRatio="none" aria-hidden="true">
      <polygon fill="#0b0d14" points="1290,0 1110,400 1215,410 990,790 1095,800 790,1200 850,1200 1150,830 1045,820 1270,440 1165,430 1350,0"/>
    </svg>
    <div class="sub">Now playing</div>
    <div class="label" id="label"></div>
    <div class="name n1" id="n1"></div>
    <div class="vs" id="vs">VS</div>
    <div class="name n2" id="n2"></div>
  </div>
  <div class="flash" id="flash"></div>
  <div class="pname" id="pname"></div>
</div>
<script>
const PAIRS = [
  ['Andrei', 'Bobr', 'Group A'],
  ['Maxim Petrov', 'Igor', 'Group B'],
  ['Alexander the Great', 'Lena', 'Group C'],
  ['Timur', 'Sergey', 'Semi-final 1'],
  ['Konstantin Konstantinopolsky', 'Alexander the Great', 'Group D'],
  ['Константин Константинопольский', 'Ян', 'Group A'],
  ['Константинопольский', 'Alexander the Great', 'Final'],
];
const HOLD_MS = 4500;
const PATTERNS = ['halftone', 'carbon', 'chevron', 'ropes', 'checker', 'felt']; // a new one on every round
const $ = (id) => document.getElementById(id);

// Same as the board: fit the 1920×1080 stage into what is really visible (TV browsers zoom pages).
const stage = $('stage');
function fit() {
  const vv = window.visualViewport;
  const a = vv && vv.width > 0 ? { w: vv.width, h: vv.height, x: vv.pageLeft, y: vv.pageTop } : { w: innerWidth, h: innerHeight, x: 0, y: 0 };
  const k = Math.min(a.w / 1920, a.h / 1080);
  stage.style.transform = `translate(${a.x + (a.w - 1920 * k) / 2}px, ${a.y + (a.h - 1080 * k) / 2}px) scale(${k})`;
}
addEventListener('resize', fit);
window.visualViewport?.addEventListener('resize', fit);
setInterval(fit, 2000);
fit();

function setName(el, text) {
  el.innerHTML = '';
  const span = document.createElement('span');
  span.textContent = text;
  el.append(span);
  // Shrink until it fits: at most 2 lines in the box, and no single word wider than the box.
  let size = 150;
  el.style.fontSize = `${size}px`;
  const lines = () => Math.round(span.offsetHeight / size);
  while (size > 40 && (span.scrollWidth > el.clientWidth + 1 || lines() > 2 || span.offsetHeight > el.clientHeight)) {
    el.style.fontSize = `${(size -= 4)}px`;
  }
}

// Impact: the whole ring jolts, a white flash.
function impact(at, power) {
  $('ring').animate([
    { transform: 'none' },
    { transform: `translate(${-power}px, ${power * 0.6}px) rotate(-.4deg)`, offset: 0.15 },
    { transform: `translate(${power * 0.7}px, ${-power * 0.5}px) rotate(.3deg)`, offset: 0.35 },
    { transform: `translate(${-power * 0.35}px, ${power * 0.25}px)`, offset: 0.6 },
    { transform: 'none' },
  ], { duration: 380, delay: at, easing: 'ease-out' });
  $('flash').animate([{ opacity: power / 60 }, { opacity: 0 }], { duration: 260, delay: at, easing: 'ease-out' });
}

let i = 0;
function play() {
  const [a, b, label] = PAIRS[i++ % PAIRS.length];
  $('label').textContent = label;
  setName($('n1'), a);
  setName($('n2'), b);
  const pat = PATTERNS[(i - 1) % PATTERNS.length];
  $('pattern').className = `pattern p-${pat}`;
  const bolt = (i - 1) % 2 === 1; // every other round: the lightning divider
  $('ring').classList.toggle('bolted', bolt);
  $('pname').textContent = `pattern: ${pat} · divider: ${bolt ? 'lightning' : 'band'}`;
  const T1 = 120; // player 1 punches in
  const T2 = 420; // player 2 answers
  const TV = 820; // VS slams down
  const FLY = 330; // very fast flight
  // From beyond the opposite edge, leaning into the move, slight stretch; lands with a hard stop and recoil.
  const punch = (from, dir) => [
    { transform: `translateX(${from}px) skewX(${-dir * 22}deg) scaleX(1.25)`, easing: 'cubic-bezier(.5,0,.9,.4)' },
    { transform: `translateX(${-dir * 50}px) skewX(${dir * 10}deg) scaleX(.92)`, offset: 0.78, easing: 'ease-out' },
    { transform: 'translateX(0) skewX(0) scaleX(1)' },
  ];
  $('n1').animate(punch(1920, 1), { duration: FLY, delay: T1, fill: 'backwards' });
  $('n2').animate(punch(-1920, -1), { duration: FLY, delay: T2, fill: 'backwards' });
  impact(T1 + FLY * 0.78, 22);
  impact(T2 + FLY * 0.78, 22);
  $('vs').animate([
    { transform: 'scale(6) rotate(-12deg)', opacity: 0, easing: 'cubic-bezier(.6,0,.9,.5)' },
    { transform: 'scale(.85) rotate(4deg)', opacity: 1, offset: 0.7 },
    { transform: 'scale(1) rotate(0)', opacity: 1 },
  ], { duration: 340, delay: TV, fill: 'backwards' });
  impact(TV + 240, 36);
  // Header and label hit first.
  $('label').animate([{ opacity: 0, transform: 'translateY(-30px)' }, { opacity: 1, transform: 'none' }], { duration: 250, fill: 'backwards' });
  setTimeout(play, TV + 600 + HOLD_MS);
}
play();
</script>
</body>
</html>

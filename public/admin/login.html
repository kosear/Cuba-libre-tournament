<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Cuba Libre</title>
<link rel="stylesheet" href="/admin/style.css">
</head>
<body>
<main class="login">
  <div class="brand"><svg viewBox="0 0 100 100"><polygon points="0,0 100,50 0,100" fill="#D21034"/><polygon points="30.0,35.0 33.5,45.1 44.3,45.4 35.7,51.9 38.8,62.1 30.0,56.0 21.2,62.1 24.3,51.9 15.7,45.4 26.5,45.1" fill="#fff"/></svg><h1>Cuba Libre admin</h1></div>
  <form id="login">
    <label>Login
      <input id="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    </label>
    <label>Password
      <input id="password" type="password" autocomplete="current-password" required>
    </label>
    <button>Sign in</button>
    <p id="error" class="error" hidden></p>
  </form>
</main>
<script src="/admin/login.js"></script>
</body>
</html>
